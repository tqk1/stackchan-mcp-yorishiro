name: Feature request
description: Suggest a new capability or improvement for the gateway or firmware.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please keep the proposal focused on public,
        technical context so other builders can weigh in.

        Note that this is a personal hard fork with an opinionated direction.
        Proposals are most likely to land when they fit the design principles
        below.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation / problem
      description: What problem does this solve? What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        Describe the change. For new MCP tools or behavior, sketch the tool
        name, arguments, and where it runs (gateway vs. firmware).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you prefer the proposal.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - gateway (Python MCP gateway)
        - firmware (ESP32 / StackChan board)
        - docs
        - build / CI
        - not sure
    validations:
      required: true
  - type: checkboxes
    id: design-principles
    attributes:
      label: Design principle alignment
      description: |
        This project follows a few hard constraints. Check the ones your
        proposal is consistent with, and explain any tension in the field below.
      options:
        - label: "Explicit triggers only: no always-on listening; interaction starts from a clear trigger (screen tap, back-of-head stroke, etc.)."
          required: false
        - label: "Low-level reflexes stay on the firmware: proximity, touch, and motion responses run on the ESP32 without a round trip to the agent."
          required: false
        - label: "Only context interpretation goes to the agent: conversation, decisions, appliance control, queries — not raw reflexes."
          required: false
        - label: "Latency first (for now): favor responsiveness over maximal quality where the two conflict."
          required: false
  - type: textarea
    id: principle-notes
    attributes:
      label: Notes on design-principle fit
      description: If your proposal is in tension with any principle above, explain the trade-off here.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, references, prior art, or anything else that helps.
    validations:
      required: false
